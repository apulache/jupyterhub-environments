# Deploy with JupyterHub chart 4.4.1 (JupyterHub 5.5.1).
# Tags contain the full source commit SHA. The verified OCI manifest digests are
# recorded beside the respective images and must match the deployed pod imageIDs.
hub:
  # Only nodes explicitly labelled for application workloads may host Hub pods.
  nodeSelector:
    apulache.io/workload: application
  image:
    # Use the chart's official, dependency-complete Hub image. Custom images
    # below are only for single-user Python environments.
    name: quay.io/jupyterhub/k8s-hub
    tag: "4.4.1"
  deploymentStrategy:
    type: Recreate
  db:
    type: sqlite-pvc
    pvc:
      storage: 1Gi
      storageClassName: longhorn-single-replica
  config:
    JupyterHub:
      authenticator_class: nativeauthenticator.NativeAuthenticator
      admin_access: true
    Authenticator:
      admin_users:
        - apulache
      allowed_users:
        - apulache
    NativeAuthenticator:
      enable_signup: true
      open_signup: false
      check_common_password: true
      minimum_password_length: 12
      allowed_failed_logins: 5

proxy:
  chp:
    nodeSelector:
      apulache.io/workload: application
  service:
    type: ClusterIP

singleuser:
  # Applies to every newly spawned JupyterLab server.
  nodeSelector:
    apulache.io/workload: application
  # Reserve and cap each user server at a size that fits the 8Gi workers.
  # Matching requests make the rpi5-worker03 preference capacity-aware.
  cpu:
    guarantee: 3
    limit: 3
  memory:
    # KubeSpawner accepts decimal K/M/G/T quantities here, not Kubernetes Gi.
    guarantee: 5G
    limit: 5G
  # Prefer the Pi 5 worker for user compute, but fall back to either other
  # labelled worker when it cannot satisfy this pod's requested resources.
  extraPodConfig:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - rpi5-worker03
  fsGid: 1000
  storage:
    type: dynamic
    # User-owned conda environments and package caches share this PVC.
    capacity: 25Gi
    dynamic:
      storageClass: longhorn-single-replica
      storageAccessModes:
        - ReadWriteOnce
  profileList:
    - display_name: Python 3.12
      description: Python 3.12 JupyterLab environment
      default: true
      kubespawner_override:
        image: ghcr.io/apulache/jupyterhub-python@sha256:98e85ddd806d9fa6bdb5423beee0c679f434d428c6f97a6551ebb57dd691da40
    - display_name: Python 3.13
      description: Python 3.13 JupyterLab environment
      kubespawner_override:
        image: ghcr.io/apulache/jupyterhub-python@sha256:08c6b999d7ddf2601af65cab24d537bd507fd3c67471f66d7228d1dc05309a23
    - display_name: Python 3.14
      description: Python 3.14 JupyterLab environment
      kubespawner_override:
        image: ghcr.io/apulache/jupyterhub-python@sha256:cea15c9205688d3f5fa5234adfe5e1869e439ff73da532b030b8d1c2efa00db4
    - display_name: Kernel Workbench (preview)
      description: Shared Scientific Python 3.13 plus reproducible personal kernels
      kubespawner_override:
        # CI commit ece1b8e980b97dc001ccad05d03eaded7b5f7738; pin the
        # published image by digest so this profile can never drift.
        image: ghcr.io/apulache/jupyterhub-kernel-workbench@sha256:1b7a6236c6135f50473abeee5a61759ff3abe82a641670bcaa3aa8998771d79a

scheduling:
  userScheduler:
    nodeSelector:
      apulache.io/workload: application

prePuller:
  # The hook puller is constrained to workers. The continuous puller has no
  # nodeSelector field in chart 4.4.1, so disable it rather than run it on master.
  continuous:
    enabled: false
  hook:
    nodeSelector:
      apulache.io/workload: application

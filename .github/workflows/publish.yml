name: Build and publish JupyterHub images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-kernel-locks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check conda-lock==4.0.2
      - name: Verify the committed ARM64 scientific lockfile
        run: |
          conda-lock lock --micromamba --platform linux-aarch64 \
            --file kernels/scientific-py313/environment.yml \
            --lockfile kernels/scientific-py313/scientific-py313.conda-lock.yml \
            --check-input-hash
          git diff --exit-code -- kernels/scientific-py313/scientific-py313.conda-lock.yml

  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.singleuser
          build-args: |
            PYTHON_VERSION=${{ matrix.image }}
          # This is a BuildKit secret, never a Docker build argument. Configure
          # JUPYTER_ADMIN_PASSWORD in the repository's Actions secrets before
          # publishing images.
          secrets: |
            admin_password=${{ secrets.JUPYTER_ADMIN_PASSWORD }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jupyterhub-python:${{ matrix.image }}-${{ github.sha }}
  hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jupyterhub-hub:${{ github.sha }}

  kernel-workbench:
    needs: validate-kernel-locks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test the ARM64 workbench image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workbench
          platforms: linux/arm64
          load: true
          tags: local/jupyterhub-kernel-workbench:${{ github.sha }}
          # A non-production password is used solely for the disposable smoke
          # image, so the build can validate without exposing the real secret.
          secrets: |
            admin_password=ci-smoke-only-password
      - name: Verify registered shared kernel
        run: |
          docker run --rm --platform linux/arm64 \
            --entrypoint /bin/bash local/jupyterhub-kernel-workbench:${{ github.sha }} \
            -lc 'jupyter kernelspec list && /opt/conda/envs/scientific-py313/bin/python -c "import altair, numpy, pandas, scipy, sklearn, matplotlib, sympy; print(\"scientific kernel smoke test passed\")"'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable ARM64 workbench image
        id: publish-workbench
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workbench
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/jupyterhub-kernel-workbench:${{ github.sha }}
          secrets: |
            admin_password=${{ secrets.JUPYTER_ADMIN_PASSWORD }}
      - name: Record deployment reference
        run: |
          echo "## Kernel Workbench release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/${{ github.repository_owner }}/jupyterhub-kernel-workbench:${{ github.sha }}@${{ steps.publish-workbench.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

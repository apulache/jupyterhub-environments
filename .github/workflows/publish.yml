name: Build and publish JupyterHub images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.singleuser
          build-args: |
            PYTHON_VERSION=${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jupyterhub-python:${{ matrix.image }}-${{ github.sha }}
  hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jupyterhub-hub:${{ github.sha }}
